{% extends "base.html" %}
{% block title %}Sign in · vinted-sniper{% endblock %}
{% block content %}
<section style="max-width: 24rem; margin: 3rem auto;">
  <h2>Sign in</h2>
  <div class="card">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="access_token">Access token</label>
      <input type="password" id="access_token" name="access_token" autofocus required>
      <p class="muted" style="margin: .6rem 0 1rem;">
        The value of <code>VINTED_SNIPER_WEB_AUTH_TOKEN</code>.
      </p>
      <button type="submit">Sign in</button>
    </form>
  </div>
</section>
{% endblock %}

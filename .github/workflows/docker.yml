name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # The Release workflow calls this with the tag it just created: a tag pushed with a
  # workflow's own token starts no other workflow, so the push above never fires for it.
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish the image for, such as v2.1.0.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Never cancel a half-finished publish, and never let two runs race to move `latest`.
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Both needed to attach signed build provenance to the published image.
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When called by Release, the tagged commit; otherwise whatever triggered the run.
          ref: ${{ inputs.tag }}
          # No job here pushes, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is the newest release, so people who never touch the tag only get
          # versions that went through a release. `edge` is every push to main, for anyone
          # who wants fixes before they are released. Release tags also get `2.1.0`,
          # `2.1` and `2`, so a compose file can pin as tightly as its owner likes.
          # Called by Release, github.ref is the branch it ran from, so the version comes
          # from the tag passed in (`value`), and `edge` stays where it is.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }},enable=${{ !startsWith(inputs.tag || github.ref_name, 'v0.') }}
            type=edge,branch=main,enable=${{ !inputs.tag }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # arm64 matters here: a Raspberry Pi at home is the setup this project
          # recommends first.
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lets anyone check where the image came from: `gh attestation verify`. The image is
      # already published by this point, and signing depends on Sigstore's public log, which
      # has outages; one retry, then a warning rather than a failed release.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - if: steps.attest.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

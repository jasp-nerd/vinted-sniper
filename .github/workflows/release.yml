name: Release

# One button: Actions, Release, Run workflow (on main). It releases the version written in
# pyproject.toml: creates the tag, publishes the package to PyPI, builds the Docker image
# and creates the GitHub release that the dashboard's update notice reads. See "Cutting a
# release" in CONTRIBUTING.md.
#
# Pushing a version tag by hand still works too. Then docker.yml builds the image by itself
# on the same push, and the job here that calls it is skipped.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # One release at a time, and never one cancelled half-way.
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Creates the tag, through the API, when started from the button.
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag is made through the API, so git itself never needs the token.
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Read the version
        id: version
        run: echo "tag=v$(uv version --short)" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with pyproject.toml would publish a package whose version
      # says something different from the release it came from.
      - name: Check a pushed tag matches the package version
        if: github.event_name == 'push'
        env:
          PUSHED: ${{ github.ref_name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$PUSHED" != "$TAG" ]; then
            echo "::error::Tag $PUSHED does not match the version in pyproject.toml ($TAG)."
            exit 1
          fi

      # Checked before anything leaves the runner, so a release never goes out without notes.
      - name: Check CHANGELOG.md has a section for this version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! grep -qF "## [${TAG#v}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG#v}]' section. Rename [Unreleased] to it first."
            exit 1
          fi

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != main ]; then
            echo "::error::Releases are made from main; this run was started on $BRANCH."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::error::$TAG already exists. Raise the version in pyproject.toml for a new release."
            exit 1
          fi
          # An annotated tag, as `git tag -a` would make, on the commit this run started from.
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="$TAG" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent
          echo "Tagged $GITHUB_SHA as $TAG."

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          # No job here pushes, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: PyPI accepts an identity token from this exact repository,
    # workflow and environment, so no API token is stored anywhere. Set up once on pypi.org
    # (see "One-time PyPI setup" in CONTRIBUTING.md), and add the `pypi` environment in the
    # repository settings.
    environment:
      name: pypi
      url: https://pypi.org/project/vinted-bot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Also uploads signed attestations of where each file was built. Signing goes through
      # Sigstore's public log, which has outages, so a failed upload is tried once more;
      # skip-existing lets that second try (or a re-run) skip files already on PyPI.
      - id: upload
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        continue-on-error: true
        with:
          skip-existing: true

      - if: steps.upload.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  image:
    needs: prepare
    # A pushed tag starts docker.yml by itself; a tag made by `prepare` does not.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: $/.github/workflows/docker.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  github-release:
    # Last, because the release is what tells running copies to update: by then the package
    # is on PyPI and the image is published. `image` is skipped for a pushed tag, which must
    # not hold this back, hence the condition.
    needs: [prepare, build, pypi, image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # The release notes are this version's section of CHANGELOG.md, so they are written
      # once, reviewed in the pull request, and never retyped into a web form.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version="${TAG#v}"
          # From this version's heading up to the next heading or the link list at the end.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md

# Vinted changes its API without telling anyone, and the usual way a tool in this space
# dies is quietly: it keeps running, stops finding anything, and nobody notices for weeks.
# This makes one real request a week so that we hear about it before users do.
name: Canary

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Fetch one real search
        id: check
        run: uv run vinted-sniper check --url "https://www.vinted.com/catalog?search_text=nike"

      - name: Open an issue if it broke
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Canary failed: the live check against Vinted did not work";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "canary",
            });
            if (existing.data.some(issue => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["canary"],
              body: [
                "The weekly live check failed. Either Vinted changed something, or this",
                "runner's address is being challenged.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Worth checking before assuming the worst: a single blocked runner is not",
                "the same as a broken API. Re-run it once before digging in.",
              ].join("\n"),
            });
